[project]
name = "lpw"
version = "0.0.1"
description = "Learned-Policy World: next-event predictor to agent-based synthetic AML simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "polars",
    "pyarrow",
    "scikit-learn",
    "torch",
    "pyyaml",
    "networkx>=3.7",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpw"]
